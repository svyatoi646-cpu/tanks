<script>
let audioCtx = null;
let menuMusicInterval = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function initAudioUserAction() {
  initAudio();
  if (!menuMusicInterval && gameState === 'MENU') {
    startMenuMusic();
  }
}

function playShootSound() {
  initAudio();
  if (!audioCtx) return;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function playExplosionSound() {
  initAudio();
  if (!audioCtx) return;
  let bufferSize = audioCtx.sampleRate * 0.4;
  let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  let data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
  let noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  let filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(600, audioCtx.currentTime);
  filter.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);
  let gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

function startMenuMusic() {
  stopMenuMusic();
  initAudio();
  const melody = [330, 330, 392, 330, 261, 294, 330, 0, 330, 330, 392, 440, 392, 330, 294, 0];
  let step = 0;
  menuMusicInterval = setInterval(() => {
    if (gameState !== 'MENU' || !audioCtx) return;
    let freq = melody[step % melody.length];
    if (freq > 0) {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    }
    step++;
  }, 160);
}

function stopMenuMusic() {
  if (menuMusicInterval) {
    clearInterval(menuMusicInterval);
    menuMusicInterval = null;
  }
}

const container = document.getElementById('game-container');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let MAP_W = 900;
let MAP_H = 600;

let currentLevel = 1;
let maxUnlockedLevel = 1;
let coins = 0;
let gameState = 'MENU';
let isBossLevel = false;

let maxSimultaneousEnemies = 4;
let screenShake = 0;

// Новая таблица цен и бонусов скорости танка
const speedLevels = [
  { bonus: 1.2, cost: 200 },
  { bonus: 1.4, cost: 250 },
  { bonus: 1.6, cost: 300 },
  { bonus: 1.8, cost: 350 },
  { bonus: 2.0, cost: 400 },
  { bonus: 2.2, cost: 450 },
  { bonus: 2.4, cost: 500 },
  { bonus: 2.6, cost: 550 }
];
let speedUpgradeIndex = 0;
let shieldSeconds = 0; // Максимум 6 секунд

// Уровни скорострельности (пулеметные апгрейды)
const fireRateLevels = [
  { name: 'Ускоренная стрельба', cost: 200, multiplier: 1.5 },
  { name: 'Двойной темп стрельбы', cost: 500, multiplier: 2.0 }
];
let fireRateUpgradeIndex = 0;

const defaultPlayerStats = { speed: 3.5, bulletSpeed: 7, fireInterval: 30, hasShield: false, shieldTimer: 0 };
let playerStats = { ...defaultPlayerStats };

const player = { x: 450, y: 520, angle: -Math.PI / 2, hp: 100, shootCooldown: 0 };

let bullets = [];
let enemyBullets = [];
let enemies = [];
let walls = [];
let particles = [];
let tracks = [];

let totalEnemiesToSpawn = 0;
let enemySpawnTimer = 0;
let enemySpawnInterval = 60;
let boss = null;

let playerBase = { x: 415, y: 540, w: 70, h: 40, hp: 100 };
let enemyBase = { x: 415, y: 40, w: 70, h: 40, hitsLeft: 10 };

function updateMenuCoins() {
  document.getElementById('menu-coins-display').innerText = `💰 МОНЕТЫ: ${coins}`;
}

function updateShopUI() {
  // Скорость танка
  const speedLabel = document.getElementById('shop-speed-label');
  const speedBtn = document.getElementById('btn-buy-speed');
  if (speedUpgradeIndex < speedLevels.length) {
    const nextLvl = speedLevels[speedUpgradeIndex];
    speedLabel.innerText = `СКОРОСТЬ (+${nextLvl.bonus})`;
    speedBtn.innerText = `${nextLvl.cost} 🪙`;
    speedBtn.style.opacity = "1";
  } else {
    speedLabel.innerText = `СКОРОСТЬ (МАКС)`;
    speedBtn.innerText = `---`;
    speedBtn.style.opacity = "0.5";
  }

  // Скорострельность
  const fireLabel = document.getElementById('shop-fire-label'); // Убедитесь, что в HTML есть этот ID, либо добавьте в магазин
  const fireBtn = document.getElementById('btn-buy-fire');
  if (fireRateUpgradeIndex < fireRateLevels.length) {
    const nextFire = fireRateLevels[fireRateUpgradeIndex];
    if(fireLabel) fireLabel.innerText = nextFire.name.toUpperCase();
    if(fireBtn) {
      fireBtn.innerText = `${nextFire.cost} 🪙`;
      fireBtn.style.opacity = "1";
    }
  } else {
    if(fireLabel) fireLabel.innerText = `ТЕМП СТРЕЛЬБЫ (МАКС)`;
    if(fireBtn) {
      fireBtn.innerText = `---`;
      fireBtn.style.opacity = "0.5";
    }
  }

  // Щит (до 6 секунд по вашему условию)
  const shieldLabel = document.getElementById('shop-shield-label');
  const shieldBtn = document.getElementById('btn-buy-shield');
  const nextShieldSec = shieldSeconds + 1;
  
  if (nextShieldSec <= 6) {
    let shieldCost = 100;
    if (nextShieldSec === 2) shieldCost = 130;
    else if (nextShieldSec === 3) shieldCost = 160;
    else if (nextShieldSec === 4) shieldCost = 190;
    else if (nextShieldSec === 5) shieldCost = 220;
    else if (nextShieldSec === 6) shieldCost = 250;

    shieldLabel.innerText = `ЭНЕРГО-ЩИТ (${nextShieldSec} СЕК)`;
    shieldBtn.innerText = `${shieldCost} 🪙`;
    shieldBtn.style.opacity = "1";
  } else {
    shieldLabel.innerText = `ЭНЕРГО-ЩИТ (МАКС 6 СЕК)`;
    shieldBtn.innerText = `---`;
    shieldBtn.style.opacity = "0.5";
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(err => console.log(err));
  } else {
    document.exitFullscreen();
  }
}

const levelGrid = document.getElementById('level-grid');
function initLevelGrid() {
  levelGrid.innerHTML = '';
  for (let i = 1; i <= 50; i++) {
    const btn = document.createElement('button');
    btn.className = `lvl-btn ${i > maxUnlockedLevel ? 'locked' : ''}`;
    btn.innerText = i % 10 === 0 ? `👹${i}` : i;
    btn.onclick = (e) => { 
      e.stopPropagation();
      if (i <= maxUnlockedLevel) startLevel(i); 
    };
    levelGrid.appendChild(btn);
  }
}
initLevelGrid();
updateMenuCoins();
startMenuMusic();

function openTanksInfo() {
  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('tanks-screen').classList.remove('hidden');
}

function openShop() {
  document.getElementById('shop-msg').innerText = '';
  updateShopUI();
  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('shop-screen').classList.remove('hidden');
}

function closeSubMenu() {
  document.getElementById('tanks-screen').classList.add('hidden');
  document.getElementById('shop-screen').classList.add('hidden');
  document.getElementById('menu-screen').classList.remove('hidden');
  updateMenuCoins();
}

function showShopMessage(msg, isError = true) {
  const el = document.getElementById('shop-msg');
  el.style.color = isError ? '#ff3333' : '#00e676';
  el.innerText = msg;
}

function buyUpgrade(type) {
  initAudio();
  if (type === 'speed') {
    if (speedUpgradeIndex >= speedLevels.length) { showShopMessage('СКОРОСТЬ МАКСИМАЛЬНА!'); return; }
    const lvl = speedLevels[speedUpgradeIndex];
    if (coins >= lvl.cost) {
      coins -= lvl.cost; 
      speedUpgradeIndex++;
      let currentBonus = speedLevels.slice(0, speedUpgradeIndex).reduce((sum, item) => sum + item.bonus, 1.2);
      playerStats.speed = defaultPlayerStats.speed + currentBonus - 1.2;
      updateHUD(); updateMenuCoins(); updateShopUI();
      showShopMessage(`СКОРОСТЬ УЛУЧШЕНА!`, false);
    } else { showShopMessage('НЕДОСТАТОЧНО МОНЕТ!'); }
  } else if (type === 'fireRate') {
    if (fireRateUpgradeIndex >= fireRateLevels.length) { showShopMessage('СКОРОСТЬ СТРЕЛЬБЫ МАКСИМАЛЬНА!'); return; }
    const nextFire = fireRateLevels[fireRateUpgradeIndex];
    if (coins >= nextFire.cost) {
      coins -= nextFire.cost;
      fireRateUpgradeIndex++;
      playerStats.fireInterval = Math.max(8, Math.floor(defaultPlayerStats.fireInterval / nextFire.multiplier));
      updateHUD(); updateMenuCoins(); updateShopUI();
      showShopMessage('СКОРОСТЬ СТРЕЛЬБЫ УВЕЛИЧЕНА!', false);
    } else { showShopMessage('НЕДОСТАТОЧНО МОНЕТ!'); }
  } else if (type === 'shield') {
    if (shieldSeconds >= 6) { showShopMessage('ЩИТ МАКСИМАЛЕН (6 СЕК)!'); return; }
    const nextSec = shieldSeconds + 1;
    let cost = 100;
    if (nextSec === 2) cost = 130;
    else if (nextSec === 3) cost = 160;
    else if (nextSec === 4) cost = 190;
    else if (nextSec === 5) cost = 220;
    else if (nextSec === 6) cost = 250;

    if (coins >= cost) {
      coins -= cost; 
      shieldSeconds = nextSec; 
      playerStats.hasShield = true;
      playerStats.shieldTimer = shieldSeconds * 60; 
      updateHUD(); updateMenuCoins(); updateShopUI();
      showShopMessage(`ЩИТ НА ${shieldSeconds} СЕК. КУПЛЕН!`, false);
    } else { showShopMessage('НЕДОСТАТОЧНО МОНЕТ!'); }
  }
}

function startLevel(lvl) {
  stopMenuMusic();
  currentLevel = lvl;
  gameState = 'PLAY';
  isBossLevel = (lvl % 10 === 0);

  MAP_W = Math.min(1500, 850 + (lvl - 1) * 15);
  MAP_H = Math.min(1000, 600 + (lvl - 1) * 10);
  canvas.width = MAP_W;
  canvas.height = MAP_H;

  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('end-screen').classList.add('hidden');

  player.x = MAP_W / 2; 
  player.y = MAP_H - 70; 
  player.hp = 100;
  player.angle = -Math.PI / 2;
  player.shootCooldown = 0;

  if (shieldSeconds > 0) {
    playerStats.hasShield = true;
    playerStats.shieldTimer = shieldSeconds * 60;
  }

  playerBase.w = 70; playerBase.h = 40;
  playerBase.x = MAP_W / 2 - 35;
  playerBase.y = MAP_H - 50;
  playerBase.hp = 100;

  enemyBase.w = 70; enemyBase.h = 40;
  enemyBase.x = MAP_W / 2 - 35;
  enemyBase.y = 40;
  enemyBase.hitsLeft = 10;

  bullets = []; enemyBullets = []; enemies = []; walls = []; particles = []; tracks = [];
  boss = null;

  generateMapWalls();
  resolveEntityStuck(player);

  maxSimultaneousEnemies = Math.min(15, 4 + Math.floor(lvl / 2));

  if (isBossLevel) {
    document.getElementById('hud-boss').style.display = 'block';
    boss = {
      x: MAP_W / 2, y: 120, hp: 100, maxHp: 100,
      speed: 1.2, angle: Math.PI / 2, fireTimer: 0, fireInterval: 42, spawnMinionTimer: 0
    };
    totalEnemiesToSpawn = 0; 
  } else {
    document.getElementById('hud-boss').style.display = 'none';
    totalEnemiesToSpawn = 4 + lvl * 2; 
  }

  enemySpawnTimer = 0;
  updateHUD();
}

// Реалистичный мощный взрыв танка с разлетающимися кусками брони и искрами
function createRealisticTankExplosion(x, y) {
  screenShake = 10;
  playExplosionSound();
  
  // Клубы дыма и огня
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 6;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      size: 3 + Math.random() * 8, 
      color: Math.random() > 0.4 ? '#ff5722' : '#ff9100', 
      alpha: 1, decay: 0.015 + Math.random() * 0.02
    });
  }

  // Металлические осколки гусениц и брони
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 3, 
      color: '#333333', 
      alpha: 1, decay: 0.01 + Math.random() * 0.015
    });
  }
}

function createExplosion(x, y, color = '#ff9100', count = 12) {
  screenShake = 5;
  playExplosionSound();
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 4, color, alpha: 1, decay: 0.02 + Math.random() * 0.03
    });
  }
}

function spawnSingleEnemy() {
  if (enemies.length >= maxSimultaneousEnemies) return;
  let type = 'normal';
  if (currentLevel >= 3 && Math.random() > 0.5) type = 'fast';
  if (currentLevel >= 5 && Math.random() > 0.6) type = 'heavy';

  const possibleAngles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

  let newEnemy = {
    x: 80 + Math.random() * (MAP_W - 160), 
    y: isBossLevel ? 200 : 100, 
    type,
    hp: type === 'heavy' ? 5 : 1, 
    maxHp: type === 'heavy' ? 5 : 1,
    speed: type === 'fast' ? 2.8 : (type === 'heavy' ? 1.3 : 1.8),
    angle: possibleAngles[Math.floor(Math.random() * possibleAngles.length)], 
    fireTimer: 0,
    fireInterval: type === 'fast' ? 40 : (type === 'heavy' ? 60 : 50),
    changeDirTimer: 0, 
    abilityTimer: 0, 
    shieldTimer: 0, 
    isRaging: false,
    stuckCounter: 0,
    lastX: 0,
    lastY: 0
  };

  resolveEntityStuck(newEnemy);
  enemies.push(newEnemy);
}

function generateMapWalls() {
  walls.push({ x: playerBase.x - 15, y: playerBase.y - 15, w: playerBase.w + 30, h: 15, hp: 2 });
  if (!isBossLevel) {
    walls.push({ x: enemyBase.x - 40, y: enemyBase.y + enemyBase.h + 20, w: enemyBase.w + 80, h: 20, hp: 4 });
    walls.push({ x: enemyBase.x - 15, y: enemyBase.y + enemyBase.h, w: enemyBase.w + 30, h: 15, hp: 2 });
  }

  let cols = Math.floor(MAP_W / 110);
  let rows = Math.floor((MAP_H - 250) / 100);

  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      let rand = Math.random();
      let wx = 70 + c * 105;
      let wy = 140 + r * 100;
      if (rand < 0.5) {
        walls.push({ x: wx, y: wy, w: 60, h: 20, hp: 2 });
      }
    }
  }
}

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && gameState === 'PLAY') {
    e.preventDefault();
    attemptShootPlayer();
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function attemptShootPlayer() {
  if (player.shootCooldown > 0) return;
  playShootSound();
  const angle = player.angle ?? -Math.PI / 2;
  bullets.push({
    x: player.x + Math.cos(angle) * 24,
    y: player.y + Math.sin(angle) * 24,
    vx: Math.cos(angle) * playerStats.bulletSpeed,
    vy: Math.sin(angle) * playerStats.bulletSpeed,
    isPlayer: true
  });
  player.shootCooldown = playerStats.fireInterval;
}

function updateHUD() {
  document.getElementById('hud-level').innerText = `LVL: ${currentLevel}`;
  document.getElementById('hud-coins').innerText = `COIN: ${coins}`;
  document.getElementById('hud-hp').innerText = `HP: ${Math.max(0, player.hp)}`;
  if (isBossLevel && boss) {
    document.getElementById('hud-boss').innerText = `БОСС: ${boss.hp}/100`;
  }
}

function checkCollision(x, y, radius = 12) {
  if (x < radius || x > MAP_W - radius || y < radius || y > MAP_H - radius) return true;
  for (let w of walls) {
    let closestX = Math.max(w.x, Math.min(x, w.x + w.w));
    let closestY = Math.max(w.y, Math.min(y, w.y + w.h));
    let distX = x - closestX;
    let distY = y - closestY;
    if ((distX * distX + distY * distY) < (radius * radius)) {
      return true;
    }
  }
  return false;
}

function resolveEntityStuck(entity, radius = 12) {
  if (!checkCollision(entity.x, entity.y, radius)) return;
  for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
    for (let dist = 5; dist < 100; dist += 5) {
      let testX = entity.x + Math.cos(angle) * dist;
      let testY = entity.y + Math.sin(angle) * dist;
      if (!checkCollision(testX, testY, radius)) {
        entity.x = testX;
        entity.y = testY;
        return;
      }
    }
  }
}

function update() {
  if (gameState !== 'PLAY') return;
  if (screenShake > 0) screenShake--;

  if (player.shootCooldown > 0) player.shootCooldown--;
  if (keys['Space']) attemptShootPlayer();

  resolveEntityStuck(player);

  if (playerStats.hasShield && shieldSeconds > 0) {
    playerStats.shieldTimer--;
    if (playerStats.shieldTimer <= 0) playerStats.hasShield = false;
  }

  particles.forEach((p, pi) => {
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(pi, 1);
  });

  tracks.forEach((t, ti) => {
    t.alpha -= 0.002;
    if (t.alpha <= 0) tracks.splice(ti, 1);
  });

  if (!isBossLevel) {
    if (totalEnemiesToSpawn > 0 && enemies.length < maxSimultaneousEnemies) {
      enemySpawnTimer++;
      if (enemySpawnTimer >= enemySpawnInterval) {
        spawnSingleEnemy();
        totalEnemiesToSpawn--;
        enemySpawnTimer = 0;
      }
    }
  } else if (boss) {
    boss.spawnMinionTimer++;
    if (boss.spawnMinionTimer > 180 && enemies.length < maxSimultaneousEnemies) {
      boss.spawnMinionTimer = 0;
      for (let i = 0; i < 2; i++) spawnSingleEnemy();
    }
  }

  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) { player.angle = -Math.PI / 2; dy = -1; }
  else if (keys['KeyS'] || keys['ArrowDown']) { player.angle = Math.PI / 2; dy = 1; }
  else if (keys['KeyA'] || keys['ArrowLeft']) { player.angle = Math.PI; dx = -1; }
  else if (keys['KeyD'] || keys['ArrowRight']) { player.angle = 0; dx = 1; }

  let moveSpeed = playerStats.speed;
  if (dx !== 0 && dy !== 0) moveSpeed *= 0.7071;

  if (dx !== 0 || dy !== 0) {
    let targetX = player.x + dx * moveSpeed;
    let targetY = player.y + dy * moveSpeed;

    if (!checkCollision(targetX, player.y, 12)) player.x = targetX;
    if (!checkCollision(player.x, targetY, 12)) player.y = targetY;

    if (Math.random() < 0.3) {
      tracks.push({ x: player.x, y: player.y, alpha: 0.4 });
    }
  }

  if (isBossLevel && boss) {
    if (Math.abs(player.x - boss.x) > Math.abs(player.y - boss.y)) {
      boss.angle = player.x > boss.x ? 0 : Math.PI;
    } else {
      boss.angle = player.y > boss.y ? Math.PI / 2 : -Math.PI / 2;
    }
    boss.x += Math.cos(boss.angle) * boss.speed;
    boss.y += Math.sin(boss.angle) * boss.speed;
    boss.x = Math.max(40, Math.min(MAP_W - 40, boss.x));
    boss.y = Math.max(40, Math.min(MAP_H / 2, boss.y));

    boss.fireTimer++;
    if (boss.fireTimer >= boss.fireInterval) {
      boss.fireTimer = 0;
      enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(boss.angle) * 6, vy: Math.sin(boss.angle) * 6, isBig: true });
    }
  }

  bullets.forEach((b, bi) => {
    b.x += b.vx; b.y += b.vy;
    
    walls.forEach((w, wi) => {
      if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
        createExplosion(b.x, b.y, '#ff5722', 5);
        bullets.splice(bi, 1);
        w.hp--;
        if (w.hp <= 0) {
          createExplosion(w.x + w.w/2, w.y + w.h/2, '#795548', 10);
          walls.splice(wi, 1);
        }
      }
    });

    if (isBossLevel && boss && Math.hypot(b.x - boss.x, b.y - boss.y) < 30) {
      boss.hp--;
      createExplosion(b.x, b.y, '#ff0055', 8);
      bullets.splice(bi, 1);
      updateHUD();
      if (boss.hp <= 0) {
        createRealisticTankExplosion(boss.x, boss.y);
        coins += 150;
        winLevel();
      }
      return;
    }

    if (!isBossLevel && b.x > enemyBase.x && b.x < enemyBase.x + enemyBase.w && b.y > enemyBase.y && b.y < enemyBase.y + enemyBase.h) {
      if (enemies.length > 0 || totalEnemiesToSpawn > 0) {
        createExplosion(b.x, b.y, '#00e5ff', 4);
        bullets.splice(bi, 1);
        return;
      }
      enemyBase.hitsLeft--;
      createExplosion(b.x, b.y, '#f44336', 12);
      bullets.splice(bi, 1);
      
      // За поломку базы противников даем ровно 30 монет
      coins += 30; 
      updateHUD();

      if (enemyBase.hitsLeft <= 0) { winLevel(); }
    }

    enemies.forEach((e, ei) => {
      if (Math.hypot(b.x - e.x, b.y - e.y) < 18) {
        if (e.type === 'normal' && e.shieldTimer > 0) {
          createExplosion(b.x, b.y, '#00e5ff', 4);
          bullets.splice(bi, 1);
          return;
        }
        e.hp--;
        createExplosion(b.x, b.y, '#ffeb3b', 6);
        bullets.splice(bi, 1);

        if (e.type === 'normal' && e.hp > 0) e.shieldTimer = 90;
        if (e.hp <= 0) {
          // Реалистичный взрыв танка
          createRealisticTankExplosion(e.x, e.y);
          enemies.splice(ei, 1);
          coins += 6;
          updateHUD();
        }
      }
    });
  });

  enemies.forEach(e => {
    e.changeDirTimer++;
    e.abilityTimer++;
    if (e.shieldTimer > 0) e.shieldTimer--;

    if (e.type === 'heavy' && e.hp <= 2 && !e.isRaging) {
      e.isRaging = true; e.speed *= 1.4; e.fireInterval = 35;
    }

    let currentSpeed = e.speed;
    if (e.type === 'fast' && e.abilityTimer > 180) {
      currentSpeed *= 2.5;
      if (e.abilityTimer > 210) e.abilityTimer = 0;
    }

    if (Math.hypot(e.x - e.lastX, e.y - e.lastY) < 0.4) {
      e.stuckCounter++;
    } else {
      e.stuckCounter = 0;
    }
    e.lastX = e.x; e.lastY = e.y;

    if (e.changeDirTimer > 50 || e.stuckCounter > 15) {
      e.changeDirTimer = 0; 
      e.stuckCounter = 0;
      const target = Math.random() > 0.4 ? player : { x: playerBase.x + 35, y: playerBase.y };
      const possibleAngles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
      
      if (Math.abs(target.x - e.x) > Math.abs(target.y - e.y)) {
        e.angle = target.x > e.x ? 0 : Math.PI;
      } else {
        e.angle = target.y > e.y ? Math.PI / 2 : -Math.PI / 2;
      }
      if (Math.random() < 0.3) {
        e.angle = possibleAngles[Math.floor(Math.random() * possibleAngles.length)];
      }
    }

    let nextX = e.x + Math.cos(e.angle) * currentSpeed;
    let nextY = e.y + Math.sin(e.angle) * currentSpeed;

    if (!checkCollision(nextX, e.y, 12)) e.x = nextX;
    else e.angle += Math.PI / 2; 

    if (!checkCollision(e.x, nextY, 12)) e.y = nextY;
    else e.angle -= Math.PI / 2;

    e.fireTimer++;
    if (e.fireTimer >= e.fireInterval) {
      e.fireTimer = 0;
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(e.angle) * 5, vy: Math.sin(e.angle) * 5, isBig: false });
    }
  });

  enemyBullets.forEach((eb, ebi) => {
    eb.x += eb.vx; eb.y += eb.vy;
    
    walls.forEach((w, wi) => {
      if (eb.x > w.x && eb.x < w.x + w.w && eb.y > w.y && eb.y < w.y + w.h) {
        createExplosion(eb.x, eb.y, '#ff5722', 4);
        enemyBullets.splice(ebi, 1);
        w.hp--;
        if (w.hp <= 0) walls.splice(wi, 1);
      }
    });

    let hitDist = eb.isBig ? 24 : 16;
    if (Math.hypot(eb.x - player.x, eb.y - player.y) < hitDist) {
      createExplosion(eb.x, eb.y, '#f44336', eb.isBig ? 15 : 8);
      enemyBullets.splice(ebi, 1);
      if (!playerStats.hasShield) {
        player.hp -= eb.isBig ? 45 : 20; updateHUD();
        if (player.hp <= 0) {
          createRealisticTankExplosion(player.x, player.y);
          gameOver();
        }
      }
    }

    if (!isBossLevel && eb.x > playerBase.x && eb.x < playerBase.x + playerBase.w && eb.y > playerBase.y && eb.y < playerBase.y + playerBase.h) {
      createExplosion(eb.x, eb.y, '#2196f3', 8);
      enemyBullets.splice(ebi, 1);
      playerBase.hp -= 25;
      if (playerBase.hp <= 0) gameOver();
    }
  });
}

function gameOver() {
  gameState = 'GAMEOVER';
  document.getElementById('end-title').innerText = 'GAME OVER';
  document.getElementById('end-title').style.color = '#ff3333';
  document.getElementById('end-desc').innerText = 'Ваш танк или База уничтожены!';
  document.getElementById('end-screen').classList.remove('hidden');
}

function winLevel() {
  gameState = 'WIN';
  
  if (currentLevel >= 50) {
    currentLevel = 50;
    coins += 100;
  } else {
    if (currentLevel === maxUnlockedLevel && maxUnlockedLevel < 50) {
      maxUnlockedLevel++;
      initLevelGrid();
    }
  }

  document.getElementById('end-title').innerText = isBossLevel ? 'БОСС ПОВЕРЖЕН!' : 'ПОБЕДА!';
  document.getElementById('end-title').style.color = '#00e676';
  document.getElementById('end-desc').innerText = isBossLevel 
    ? `Босс повержен! Все улучшения и монеты сохранены.` 
    : `Уровень пройден! Прогресс и улучшения сохранены.`;
  
  document.getElementById('end-screen').classList.remove('hidden');
}

function returnToMenu() {
  gameState = 'MENU';
  document.getElementById('end-screen').classList.add('hidden');
  document.getElementById('menu-screen').classList.remove('hidden');
  updateMenuCoins();
  startMenuMusic();
}

function drawBrickWall(x, y, w, h, hp) {
  ctx.fillStyle = hp >= 4 ? '#552200' : (hp === 2 ? '#b32d00' : '#731d00');
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#2b0000';
  ctx.lineWidth = 1;
  for (let bx = x; bx < x + w; bx += 10) {
    for (let by = y; by < y + h; by += 6) {
      ctx.strokeRect(bx, by, 10, 6);
    }
  }
}

function drawPixelTank(x, y, angle, color, turretColor, isShielded = false, isRaging = false, isBig = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  let scale = isBig ? 2 : 1;
  ctx.scale(scale, scale);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(-12, -16, 24, 32);

  ctx.fillStyle = '#111';
  ctx.fillRect(-14, -14, 28, 5);
  ctx.fillRect(-14, 9, 28, 5);

  ctx.fillStyle = isRaging ? '#ff0000' : color;
  ctx.fillRect(-10, -9, 20, 18);

  ctx.fillStyle = turretColor;
  ctx.fillRect(-5, -5, 10, 10);
  ctx.fillRect(0, -2, 15, 4);

  if (isShielded) {
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00e5ff';
    ctx.strokeRect(-16, -16, 32, 32);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  if (gameState === 'PLAY' || gameState === 'WIN' || gameState === 'GAMEOVER') {
    ctx.fillStyle = '#0f1f14';
    ctx.fillRect(0, 0, MAP_W, MAP_H);

    ctx.fillStyle = '#14291a';
    for (let x = 0; x < MAP_W; x += 40) {
      for (let y = 0; y < MAP_H; y += 40) {
        if ((x + y) % 80 === 0) ctx.fillRect(x, y, 40, 40);
      }
    }

    tracks.forEach(t => {
      ctx.fillStyle = `rgba(5, 15, 8, ${t.alpha})`;
      ctx.fillRect(t.x - 6, t.y - 6, 12, 12);
    });

    walls.forEach(w => drawBrickWall(w.x, w.y, w.w, w.h, w.hp));

    if (!isBossLevel) {
      ctx.fillStyle = '#0288d1';
      ctx.fillRect(playerBase.x, playerBase.y, playerBase.w, playerBase.h);
      ctx.fillStyle = '#fff';
      ctx.font = '8px "Press Start 2P"';
      ctx.fillText('БАЗА', playerBase.x + 12, playerBase.y + 25);

      const isBaseShielded = enemies.length > 0 || totalEnemiesToSpawn > 0;
      ctx.fillStyle = isBaseShielded ? '#5c1d1d' : '#d50000';
      ctx.fillRect(enemyBase.x, enemyBase.y, enemyBase.w, enemyBase.h);
      if (isBaseShielded) {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00e5ff';
        ctx.strokeRect(enemyBase.x - 4, enemyBase.y - 4, enemyBase.w + 8, enemyBase.h + 8);
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = '#fff';
      ctx.fillText(isBaseShielded ? 'ЩИТ' : `БАЗА:${enemyBase.hitsLeft}`, enemyBase.x + (isBaseShielded ? 15 : 5), enemyBase.y + 25);
    }

    if (isBossLevel && boss) {
      drawPixelTank(boss.x, boss.y, boss.angle, '#ff0055', '#ffcc00', false, false, true);
    }

    drawPixelTank(player.x, player.y, player.angle, '#00e676', '#ffffff');

    if (playerStats.hasShield && shieldSeconds > 0) {
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00e5ff';
      ctx.strokeRect(player.x - 16, player.y - 16, 32, 32);
      ctx.shadowBlur = 0;
    }

    bullets.forEach(b => {
      ctx.fillStyle = '#ffeb3b';
      ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
    });

    enemyBullets.forEach(eb => {
      ctx.fillStyle = eb.isBig ? '#ff0055' : '#ff9800';
      let r = eb.isBig ? 6 : 4;
      ctx.fillRect(eb.x - r, eb.y - r, r * 2, r * 2);
    });

    enemies.forEach(e => {
      drawPixelTank(e.x, e.y, e.angle, e.type === 'fast' ? '#00e5ff' : (e.type === 'heavy' ? '#ab47bc' : '#ff9100'), '#ffffff', e.type === 'normal' && e.shieldTimer > 0, e.isRaging);
    });

    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.globalAlpha = 1;
    });
  }
  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
