<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Tanks Elite: Warzone</title>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        #canvas { border: 2px solid #555; background: #1a1a1a; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
    </style>
</head>
<body>
    <canvas id="canvas" width="1000" height="700"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let particles = [];
let bullets = [];
let shake = 0;

// Класс взрыва (реализм)
class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random()-0.5)*8; this.vy = (Math.random()-0.5)*8;
        this.life = 20; this.color = color;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, 4, 4); }
}

// Рисование крутого танка
function drawTank(x, y, angle, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#333"; // Гусеницы
    ctx.fillRect(-20, -22, 40, 44);
    ctx.fillStyle = color; // Корпус
    ctx.fillRect(-16, -16, 32, 32);
    ctx.fillStyle = "#fff"; // Башня
    ctx.fillRect(-8, -8, 16, 16);
    ctx.fillStyle = "#ffcc00"; // Дуло
    ctx.fillRect(0, -3, 22, 6);
    ctx.restore();
}

function loop() {
    // Эффект тряски
    if(shake > 0) {
        ctx.setTransform(1, 0, 0, 1, (Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        shake *= 0.9;
    } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    ctx.fillStyle = "rgba(26, 26, 26, 0.3)";
    ctx.fillRect(0, 0, 1000, 700);

    // Обновление частиц
    particles.forEach((p, i) => {
        p.update(); p.draw();
        if(p.life <= 0) particles.splice(i, 1);
    });

    drawTank(500, 350, Date.now()/1000, "#00e676"); // Танк игрока

    requestAnimationFrame(loop);
}

// Запуск взрыва при клике
canvas.addEventListener('mousedown', (e) => {
    shake = 10;
    for(let i=0; i<15; i++) particles.push(new Particle(e.clientX-10, e.clientY-10, "#ff4500"));
});

loop();
</script>
</body>
</html>
